name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://demo:demo@127.0.0.1:3306/demo
      SESSION_SECRET: ci-only-session-secret-with-at-least-thirty-two-characters
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      ANALYTICS_HASH_SECRET: ci-only-analytics-secret-with-at-least-thirty-two-characters
      ANALYTICS_RETENTION_DAYS: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_SECRET: ci-only-session-secret-with-at-least-thirty-two-characters
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      ANALYTICS_HASH_SECRET: ci-only-analytics-secret-with-at-least-thirty-two-characters
      ANALYTICS_RETENTION_DAYS: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: mysql://generate:generate@127.0.0.1:3306/generate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker build
          --build-arg APP_VERSION=${{ github.sha }}
          --tag dn360:${{ github.sha }}
          .

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dn360_integration_test
          MYSQL_USER: integration
          MYSQL_PASSWORD: integration-password
          MYSQL_ROOT_PASSWORD: integration-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=integration --password=integration-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://unused:unused@127.0.0.1:3306/dn360_application_placeholder
      INTEGRATION_DATABASE_URL: mysql://integration:integration-password@127.0.0.1:3306/dn360_integration_test
      SESSION_SECRET: ci-only-session-secret-with-at-least-thirty-two-characters
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      ANALYTICS_HASH_SECRET: ci-only-analytics-secret-with-at-least-thirty-two-characters
      ANALYTICS_RETENTION_DAYS: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:integration
